name: Helm injection test

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'test/injection_test.py'

permissions:
  contents: 'read'

jobs:
  injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up uv and python
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: 'latest'
          python-version: '3.13'

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.11.2

      - name: Run injection test on all charts
        run: uv run test/injection_test.py charts