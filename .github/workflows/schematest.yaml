on:
  pull_request:
    paths:
      - 'charts/*/values.schema.json'
      - 'test/schema.py'
      - '.github/workflows/schematest.yaml'

permissions:
  contents: 'read'

jobs:
  detect:
    name: Detect changed values.schema.json files
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.changed.outputs.files_json }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Get changed 'values.schema.json files
        id: changed
        run: |
          # Compare commits properly for both push and PR events
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            changed=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          else
            changed=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          fi

          if echo "$changed" | grep -qE '^(test/schema\.py|\.github/workflows/schematest\.yaml)$'; then
            # Test script or workflow changed: check every chart that has a schema
            files=$(ls charts/*/values.schema.json)
          else
            files=$(echo "$changed" | grep 'values.schema.json' || true)
          fi

          files=$(echo "$files" | sed "s#/values\.schema\.json##" | sed '/^$/d' | sort -u)

          echo "Changed files:"
          echo $files

          # Convert to JSON array for the matrix
          files_json=$(printf '%s\n' "$files" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files_json=$files_json" >> $GITHUB_OUTPUT

  process:
    name: Process each changed file
    needs: detect
    if: needs.detect.outputs.files != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.detect.outputs.files) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up uv and python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 'latest'
          python-version: '3.13'

      - name: Run schema test script for ${{ matrix.file }}
        run: |
          uv run test/schema.py "${{ matrix.file }}"
