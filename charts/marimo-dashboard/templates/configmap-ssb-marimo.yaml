apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "library-chart.fullname" . }}-ssb-marimo
  labels:
    {{- include "library-chart.labels" . | nindent 4 }}
data:
  ssb-marimo.py: |
{{ .Files.Get "files/ssb-marimo.py" | indent 4 }}
  ssb-marimo: |
    #!/bin/sh
    exec uv run /opt/ssb-marimo.py "$@"
