{{- $fullName := include "library-chart.fullname" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "library-chart.fullname" . | quote }}
  annotations:
    dapla.ssb.no/enable-ssbucketeer: "true"
    dapla.ssb.no/impersonate-group: {{ quote .Values.dapla.group }}
    dapla.ssb.no/service-container-name: {{ quote .Chart.Name }}
    dapla.ssb.no/access-reason: {{ quote .Values.dapla.sourceData.reason }}
    dapla.ssb.no/requested-service-duration: {{ quote .Values.dapla.sourceData.requestedDuration }}
    dapla.ssb.no/mount-standard-buckets: {{ quote .Values.avansert.data.mountStandard }}
    dapla.ssb.no/mount-shared-buckets: {{ .Values.dapla.sharedBuckets | toJson | quote }}
  labels:
    {{- include "library-chart.labels" . | nindent 4 }}
spec:
{{- if not .Values.autoscaling.enabled }}
  {{- if .Values.global.suspend }}
  replicas: 0
  {{- else }}
  replicas: {{ .Values.replicaCount | int }}
  {{- end }}
{{- end }}
  serviceName: {{ include "library-chart.fullname" . | quote }}
  selector:
    matchLabels:
      {{- include "library-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.gitConfig.git.enabled }}
        checksum/git: {{ include (print $.Template.BasePath "/secret-git.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.oidc.enabled }}
        checksum/oidc: {{ include (print $.Template.BasePath "/secret-oidc.yaml") . | sha256sum }}
        {{- end }}
        {{- if (include "library-chart.repository.enabled"  .) }}
        checksum/repository: {{ include (print $.Template.BasePath "/configmap-repository.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "library-chart.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      volumes:
        - name: home
        {{- if .Values.diskplass.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.diskplass.existingClaim | default (include "library-chart.fullname" .) | quote }}
        {{- else }}
          emptyDir: {}
        {{- end }}
        - {{ include "library-chart.oauth2ProxyVolume" . | indent 10 | trim }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "library-chart.serviceAccountName" . | quote }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      subdomain: {{ include "library-chart.fullname" . | quote }}
      hostname: jupyter
      containers:
        - name: {{ .Chart.Name | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ printf "europe-north1-docker.pkg.dev/artifact-registry-5n/dapla-lab-docker/onyxia/jupyter:%v" .Values.tjeneste.version | quote }}
          command: ["/bin/sh","-c"]
          args: [{{ printf "%v jupyter lab --no-browser --ip '0.0.0.0' --LabApp.token='$(PASSWORD)' --ContentsManager.allow_hidden=True" .Values.init.standardInitPath | quote }}]
          imagePullPolicy: {{ .Values.tjeneste.image.pullPolicy | quote }}
          env:
            {{- include "library-chart.commonEnvVars" . | nindent 12 }}
            - name: KUBERNETES_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: IMAGE_NAME
              value: {{ printf "europe-north1-docker.pkg.dev/artifact-registry-5n/dapla-lab-docker/onyxia/jupyter:%v" .Values.tjeneste.version | quote }}
            - name: DAPLA_ENVIRONMENT
              value: {{ .Values.deployEnvironment | quote }}
            - name: DAPLA_REGION
              value: DAPLA_LAB
            {{- if .Values.avansert.parquedit.enabled }}
            - name: PARQEDIT_DB_PORT
              value: {{ .Values.avansert.parquedit.port | int | toString | quote }}
            {{- end }}
            - name: DAPLA_SERVICE
              value: JUPYTERLAB
            - name: NB_USER
              value: {{ .Values.environment.user | quote }}
            - name: PASSWORD
              value: ""
            - name: PROJECT_USER
              value: {{ .Values.environment.user | quote }}
            - name: PROJECT_GROUP
              value: {{ .Values.environment.group | quote }}
            - name: MEM_LIMIT
              value: |
                {{- $requestedmem := .Values.resources.memory | trimSuffix "Gi" | int }}
                {{- $memlimit := mul 1024 1024 1024 $requestedmem }}
                {{ $memlimit | int64 | toString }}
            - name: ROOT_PROJECT_DIRECTORY
              value: {{ printf "/home/%v/work" .Values.environment.user | quote }}
            - name: POETRY_VIRTUALENVS_IN_PROJECT
              value: "true"
            - name: JUPYTER_CONFIG_DIR
              value: {{ printf "/home/%v/work/.jupyter/config" .Values.environment.user | quote }}
            - name: JUPYTER_CONFIG_PATH
              value: {{ printf "/home/%v/work/.jupyter/config_paths" .Values.environment.user | quote }}
            - name: JUPYTER_PATH
              value: {{ printf "/home/%v/work/.jupyter/data_paths" .Values.environment.user | quote }}
            - name: JUPYTER_DATA_DIR
              value: {{ printf "/home/%v/work/.jupyter/data" .Values.environment.user | quote }}
            - name: JUPYTER_RUNTIME_DIR
              value: {{ printf "/home/%v/work/.jupyter/runtime" .Values.environment.user | quote }}
            - name: RENV_PATHS_LIBRARY
              value: {{ printf "/home/%v/work/.renv" .Values.environment.user | quote }}
            - name: RENV_PATHS_CACHE
              value: {{ printf "/home/%v/work/.renv/cache" .Values.environment.user | quote }}
            - name: JUPYTERHUB_HTTP_REFERER
              value: {{ printf "https://%v/" .Values.istio.hostname | quote }}
            - name: JUPYTERHUB_USER
              value: "onyxia"
            - name: JUPYTERHUB_SERVICE_PREFIX
              value: "/user/onyxia/"
            - name: LABID_TOKEN_EXCHANGE_URL
              value: http://labid.labid.svc.cluster.local/token
            - name: PIPX_HOME
              value: {{ printf "/home/%v/work/.local/pipx" .Values.environment.user | quote }}
            - name: PIPX_BIN_DIR
              value: {{ printf "/home/%v/work/.local/pipx/bin" .Values.environment.user | quote }}
            - name: STATBANK_BASE_URL
              value: {{ .Values.statbankBaseUrl | quote }}
            - name: STATBANK_ENCRYPT_URL
              value: {{ .Values.statbankEncryptUrl | quote }}
            - name: STATBANK_TEST_BASE_URL
              value: {{ .Values.statbankTestBaseUrl | quote }}
            - name: STATBANK_TEST_ENCRYPT_URL
              value: {{ .Values.statbankTestEncryptUrl | quote }}
            - name: SUV_DAPLA_API_URL
              value: {{ .Values.suvDaplaApiUrl | quote }}
            - name: PSEUDO_SERVICE_URL
              value: {{ .Values.pseudoServiceUrl | quote }}
            - name: MASKINPORTEN_TOKEN_URL
              value: {{ .Values.maskinportenGuardianUrl | quote }}
            - name: DAPLA_USER
              value: {{ .Values.daplaUser | quote }}
            {{- if .Values.init.regionInit }}
            - name: REGION_INIT_SCRIPT
              value: {{ .Values.init.regionInit | quote }}
            {{- end }}
            {{- if .Values.init.personalInit }}
            - name: PERSONAL_INIT_SCRIPT
              value: {{ .Values.init.personalInit | quote }}
            {{- end }}
            {{- if .Values.init.personalInitArgs }}
            - name: PERSONAL_INIT_ARGS
              value: {{ .Values.init.personalInitArgs | quote }}
            {{- end }}
            {{- if .Values.environment.root }}
            - name: GRANT_SUDO
              value: "yes"
            {{- end }}
          envFrom:
            {{- if .Values.gitConfig.git.enabled }}
            - secretRef:
                name: {{ include "library-chart.secretNameGit" . | quote }}
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - secretRef:
                name: {{ include "library-chart.secretNameOidc" . | quote }}
            {{- end }}
            {{- if (include "library-chart.repository.enabled"  .) }}
            - configMapRef:
                name: {{ include "library-chart.configMapNameRepository" . | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /user/onyxia/
              port: {{ .Values.networking.service.port | int }}
          readinessProbe:
            httpGet:
              path: /user/onyxia/
              port: {{ .Values.networking.service.port | int }}
          startupProbe:
            httpGet:
              path: /user/onyxia/
              port: {{ .Values.networking.service.port | int }}
            {{- toYaml .Values.startupProbe | nindent 12 }}     
          resources:
            requests:
              cpu: {{ .Values.resources.cpu | quote }}
              memory: {{ .Values.resources.memory | quote }}
            limits:
              memory: {{ .Values.resources.memory | quote }}
          volumeMounts:
            - mountPath: {{ printf "/home/%v/work" .Values.environment.user | quote }}
              subPath: work
              name: home
        - {{ include "library-chart.oauth2ProxyPod" . | indent 10 | trim }}
      {{- if or .Values.avansert.parquedit.enabled .Values.avansert.database.instance }}
      initContainers:
        {{- if .Values.avansert.parquedit.enabled }}
        - name: cloud-sql-proxy-parquedit
          restartPolicy: Always
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:latest
          args:
            - "--private-ip"
            - "--auto-iam-authn"
            - "--structured-logs"
            - {{ printf "--port=%d" (.Values.avansert.parquedit.port | int) | quote }}
            - "dapla-ffunk-sql-p-xo:europe-north1:parquedit"
        {{- end }}
        {{- if .Values.avansert.database.instance }}
        - name: cloud-sql-proxy
          restartPolicy: Always
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:latest
          args:
            - "--private-ip"
            - "--auto-iam-authn"
            - "--structured-logs"
            - "--port=5432"
            - {{ .Values.avansert.database.instance | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $affinityYaml := include "library-chart.nodeAffinity" (dict "cpu" (.Values.resources.cpu | trimSuffix "m") "memory" (.Values.resources.memory | trimSuffix "Gi")) }}
      {{- if $affinityYaml }}
      affinity:
        {{- $affinityYaml | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
