{{- $fullName := include "library-chart.fullname" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "library-chart.fullname" . | quote }}
  annotations:
    dapla.ssb.no/enable-ssbucketeer: "true"
    dapla.ssb.no/impersonate-group: {{ quote .Values.dapla.group }}
    dapla.ssb.no/service-container-name: {{ quote .Chart.Name }}
    dapla.ssb.no/access-reason: {{ quote .Values.dapla.sourceData.reason }}
    dapla.ssb.no/requested-service-duration: {{ quote .Values.dapla.sourceData.requestedDuration }}
    dapla.ssb.no/mount-standard-buckets: {{ quote .Values.avansert.data.mountStandard }}
    dapla.ssb.no/mount-shared-buckets: {{ .Values.dapla.sharedBuckets | toJson | quote }}
  labels:
    {{- include "library-chart.labels" . | nindent 4 }}
spec:
{{- if not .Values.autoscaling.enabled }}
  {{- if .Values.global.suspend }}
  replicas: 0
  {{- else }}
  replicas: {{ .Values.replicaCount | int }}
  {{- end }}
{{- end }}
  serviceName: {{ include "library-chart.fullname" . | quote }}
  selector:
    matchLabels:
      {{- include "library-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.oidc.enabled }}
        checksum/oidc: {{ include (print $.Template.BasePath "/secret-oidc.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "library-chart.selectorLabels" . | nindent 8 }}
    spec:
      volumes:
        - name: home
        {{- if .Values.diskplass.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.diskplass.existingClaim | default (include "library-chart.fullname" .) | quote }}
        {{- else }}
          emptyDir: {}
        {{- end }}
        - {{ include "library-chart.oauth2ProxyVolume" . | indent 10 | trim }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "library-chart.serviceAccountName" . | quote }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ printf "europe-north1-docker.pkg.dev/artifact-registry-5n/dapla-lab-docker/onyxia/jdemetra:%v" .Values.tjeneste.version | quote }}
          command: ["/bin/sh","-c"]
          args: [{{ printf "%v /opt/jdemetra-init.sh" .Values.init.standardInitPath | quote }}]
          imagePullPolicy: {{ .Values.tjeneste.pullPolicy | quote }}
          env:
            {{- if .Values.init.regionInit }}
            - name: REGION_INIT_SCRIPT
              value: {{ .Values.init.regionInit | quote }}
            {{- end }}
            {{- if .Values.init.regionInitCheckSum }}
            - name: REGION_INIT_SCRIPT_CHECKSUM
              value: {{ .Values.init.regionInitCheckSum | quote }}
            {{- end }}
            {{- if .Values.avansert.startupScript.scriptPath }}
            - name: PERSONAL_INIT_SCRIPT
              value: {{ .Values.avansert.startupScript.scriptPath | quote }}
            {{- end }}
            {{- if .Values.avansert.startupScript.scriptArgs }}
            - name: PERSONAL_INIT_ARGS
              value: {{ .Values.avansert.startupScript.scriptArgs | quote }}
            {{- end }}
            - name: DAPLA_ENVIRONMENT
              value: {{ .Values.deployEnvironment | quote }}
            - name: DAPLA_REGION
              value: DAPLA_LAB
            {{- if .Values.avansert.parquedit.enabled }}
            - name: PARQEDIT_DB_PORT
              value: {{ .Values.avansert.parquedit.port | int | toString | quote }}
            {{- end }}
            - name: DAPLA_SERVICE
              value: JDEMETRA
            - name: PASSWORD
              value: ""
            - name: PROJECT_USER
              value: {{ .Values.environment.user | quote }}
            - name: PROJECT_GROUP
              value: {{ .Values.environment.group | quote }}
            - name: ROOT_PROJECT_DIRECTORY
              value: {{ printf "/home/%v/work" .Values.environment.user | quote }}
          envFrom:
            {{- if .Values.oidc.enabled }}
            - secretRef:
                name: {{ include "library-chart.secretNameOidc" . | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.networking.user.port | default .Values.networking.service.port | int }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.networking.user.port | default .Values.networking.service.port | int }}
          resources:
            requests:
              cpu: {{ .Values.ressurser.requests.cpu | quote }}
              memory: {{ .Values.ressurser.requests.memory | quote }}
            limits:
              memory: {{ .Values.ressurser.requests.memory | quote }}
          volumeMounts:
            - mountPath: {{ printf "/home/%v/work" .Values.environment.user | quote }}
              subPath: work
              name: home
            - mountPath: /dev/shm
              name: dshm
        - {{ include "library-chart.oauth2ProxyPod" . | indent 10 | trim }}
      {{- if or .Values.avansert.parquedit.enabled .Values.avansert.database.instance }}
      initContainers:
        {{- if .Values.avansert.parquedit.enabled }}
        - name: cloud-sql-proxy-parquedit
          restartPolicy: Always
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:latest
          args:
            - "--private-ip"
            - "--auto-iam-authn"
            - "--structured-logs"
            - {{ printf "--port=%d" (.Values.avansert.parquedit.port | int) | quote }}
            - "dapla-ffunk-sql-p-xo:europe-north1:parquedit"
        {{- end }}
        {{- if .Values.avansert.database.instance }}
        - name: cloud-sql-proxy
          restartPolicy: Always
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:latest
          args:
            - "--private-ip"
            - "--auto-iam-authn"
            - "--structured-logs"
            - "--port=5432"
            - {{ .Values.avansert.database.instance | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $affinityYaml := include "library-chart.nodeAffinity" (dict "cpu" (.Values.ressurser.requests.cpu | trimSuffix "m") "memory" (.Values.ressurser.requests.memory | trimSuffix "Gi")) }}
      {{- if $affinityYaml }}
      affinity:
        {{- $affinityYaml | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

